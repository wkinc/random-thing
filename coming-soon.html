<!DOCTYPE html>
<html>
<head>
  <title>Coming Soon</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* Center everything */
    .center-screen {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Big text */
    .coming {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .sub {
      color: #aaa;
      margin-bottom: 30px;
    }

    /* Buttons */
    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 10px 20px;
      border-radius: 8px;
      border: 1px solid #333;
      background: rgba(255,255,255,0.05);
      transition: 0.2s;
    }

    .buttons a:hover {
      background: rgba(255,255,255,0.1);
    }
  </style>
</head>
<body>

<div class="center-screen">
  <div class="coming">Coming Soon</div>
  <div class="sub">this page isn’t ready yet</div>

  <div class="buttons">
    <a href="index.html">🏠 Home</a>
    <a href="javascript:history.back()">← Go Back</a>
  </div>
</div>

</body>
</html>
