<!DOCTYPE html>
<html>
<head>
  <title>Updates</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<script>
fetch("posts.json")
  .then(res => res.json())
  .then(data => {
    const container = document.getElementById("posts");

    data.reverse().forEach(post => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <h2>${post.title}</h2>
        <small>${post.date}</small>
        <p>${post.content}</p>
      `;

      container.appendChild(div);
    });
  });
</script>

</body>
</html>
